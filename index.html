<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>00 專屬早餐清單</title>

    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="早餐點餐">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ff6b6b">

    <link rel="stylesheet" href="style.css?v=20261019a">
</head>
<body>
    <div class="wrap">
        <header class="top">
            <h1>00 今天想吃什麼？</h1>
            <div class="top-right">
                <span class="admin-badge">管理模式</span>
                <button type="button" id="add-btn" class="btn primary sm add-btn" aria-label="新增店家"></button>
            </div>
        </header>

        <!-- 依類型篩選 -->
        <div class="toolbar">
            <div id="chips" class="chips" role="tablist" aria-label="依類型篩選"></div>
        </div>

        <main id="list">
            <div class="state">正在準備菜單…</div>
        </main>

        <footer class="foot">
            <span id="foot-info"></span>
            <button type="button" id="admin-btn" class="link-btn"></button>
        </footer>
    </div>

    <!-- 底部操作列：拇指按得到的位置 -->
    <nav class="bottom-bar">
        <div class="view-toggle" role="group" aria-label="切換檢視">
            <button type="button" data-view="swipe" aria-label="滑動卡片"></button>
            <button type="button" data-view="grid" aria-label="看全部"></button>
        </div>
        <button type="button" id="draw-btn" class="btn primary draw-btn" data-act="draw" disabled></button>
    </nav>

    <!-- 抽籤結果 -->
    <dialog id="pick" class="sheet" aria-live="polite"></dialog>

    <!-- 店家詳細（看全部模式點卡片） -->
    <dialog id="detail" class="sheet"></dialog>

    <!-- 管理員登入 -->
    <dialog id="login" class="sheet small">
        <form id="login-form" class="pad">
            <h2 tabindex="-1">進入管理模式</h2>
            <p class="hint">輸入通關密碼後，就能在網頁上新增、修改店家。</p>
            <input id="login-pw" type="password" autocomplete="current-password" placeholder="通關密碼" required>
            <p id="login-err" class="err"></p>
            <div class="row-btns">
                <button type="button" class="btn" data-close>取消</button>
                <button type="submit" class="btn primary">進入</button>
            </div>
        </form>
    </dialog>

    <!-- 新增／修改店家 -->
    <dialog id="editor" class="sheet tall">
        <form id="edit-form" novalidate>
            <div class="sheet-head">
                <button type="button" class="icon-btn" data-close aria-label="取消"></button>
                <h2 id="edit-title" tabindex="-1" autofocus>新增店家</h2>
                <button type="submit" class="btn primary sm" id="save-btn">儲存</button>
            </div>
            <div class="pad form">
                <label class="photo-pick">
                    <input type="file" id="f-file" accept="image/*" hidden>
                    <img id="f-preview" alt="" hidden>
                    <span class="photo-pick-label"></span>
                </label>
                <input id="f-img" type="url" placeholder="或貼上照片網址（https://…）">

                <label class="field"><span>店名<span class="req">必填</span></span>
                    <input id="f-name" maxlength="60" placeholder="例：向晨蛋餅專賣店">
                </label>
                <label class="field">電話
                    <input id="f-phone" type="tel" maxlength="30" placeholder="例：02 2788 3965">
                </label>
                <label class="field">地址
                    <input id="f-addr" maxlength="120" placeholder="例：115臺北市南港區昆陽街151號">
                </label>
                <label class="field">線上點餐網址
                    <input id="f-link" type="url" maxlength="500" placeholder="https://…">
                </label>
                <label class="field">00 愛吃什麼
                    <textarea id="f-note" rows="2" maxlength="200" placeholder="例：蔥蛋雙蛋蛋餅、蔬菜酥皮蛋餅"></textarea>
                </label>

                <div class="field">類型
                    <div id="f-types" class="chips wrap-chips"></div>
                    <div class="inline-add">
                        <input id="f-newtype" maxlength="10" placeholder="新類型，例：鐵板麵">
                        <button type="button" class="btn sm" id="f-addtype">加入</button>
                    </div>
                </div>

                <div class="field">營業時間
                    <div class="hours">
                        <input id="f-open" type="time" aria-label="開門時間">
                        <span>到</span>
                        <input id="f-close" type="time" aria-label="打烊時間">
                    </div>
                    <div class="sub">公休日</div>
                    <div id="f-off" class="days"></div>
                </div>

                <p id="edit-err" class="err"></p>
                <button type="button" id="del-btn" class="btn danger full">刪除這家店</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>

    <script src="config.js?v=20261019a"></script>
    <script src="app.js?v=20261019a"></script>
</body>
</html>
